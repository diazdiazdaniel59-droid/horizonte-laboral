<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070d1b">
  <meta name="robots" content="noindex,nofollow">
  <title>Actualizar contraseña | Horizonte Laboral</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <header class="auth-topbar"><a class="auth-brand" href="index.html"><img src="logo.png" alt=""><span>HORIZONTE LABORAL</span></a></header>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="resetTitle">
      <p class="auth-kicker">Portal Horizonte · Recuperación segura</p>
      <h1 id="resetTitle">Crea una contraseña nueva</h1>
      <p class="auth-intro">Usa el enlace enviado a tu correo para completar el cambio.</p>
      <form class="auth-form" id="passwordForm">
        <div class="auth-field"><label for="newPassword">Nueva contraseña</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div>
        <div class="auth-field"><label for="confirmPassword">Confirma la contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div>
        <button class="auth-submit" id="passwordSubmit" type="submit">Actualizar contraseña</button>
      </form>
      <p class="auth-status" id="passwordStatus" role="status" aria-live="polite"></p>
      <div class="auth-links"><a href="login.html">Volver al acceso</a></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="actualizar-password.js"></script>
</body>
</html>
